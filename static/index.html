<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Inventory Tracker</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <h1>🧺 Inventory &amp; Revenue Tracker</h1>
    <button id="net-worth" class="net-worth-badge">
      Net worth: <span id="net-worth-value">$0.00</span>
      <span class="net-worth-hint">click for history</span>
    </button>
  </header>

  <main id="products-grid" class="products-grid">
    <!-- product cards are filled in by script.js -->
  </main>

  <div id="history-overlay" class="modal-overlay">
    <div class="modal-box">
      <div class="modal-header">
        <h2>Records</h2>
        <button id="history-close" class="modal-close">&times;</button>
      </div>

      <div class="tab-row">
        <button class="tab-btn active" data-tab="history">Transactions</button>
        <button class="tab-btn" data-tab="stock">Stock</button>
      </div>

      <div class="tab-panel" data-panel="history">
        <div class="filter-row">
          <label for="tx-type-filter">Type</label>
          <select id="tx-type-filter">
            <option value="ALL" selected>ALL</option>
            <option value="sell">sell</option>
            <option value="replenish">replenish</option>
          </select>
        </div>
        <table class="history-table">
          <thead>
            <tr>
              <th>When</th>
              <th>Type</th>
              <th>Product</th>
              <th>Qty</th>
              <th>Total</th>
              <th>Net worth</th>
            </tr>
          </thead>
          <tbody id="history-body">
            <!-- filled in by script.js -->
          </tbody>
        </table>
      </div>

      <table class="history-table tab-panel hidden" data-panel="stock">
        <thead>
          <tr>
            <th>Product</th>
            <th>Stock</th>
            <th>Cost</th>
            <th>Sell price</th>
          </tr>
        </thead>
        <tbody id="stock-body">
          <!-- filled in by script.js -->
        </tbody>
      </table>
    </div>
  </div>

  <script src="/static/script.js"></script>
</body>
</html>
